# Test double for sinks-managed-identity.yaml: azure/tests/run.sh mounts this file over the
# template, so the production entrypoint, sources and mappings run unchanged while the rows go
# to stdout instead of Azure. Each row is wrapped with the name of the stream the real sink of
# that transform sends it to; the drift test joins on that name.
# The three sinks carry the ids and the durability settings of the real ones (memory buffer,
# end-to-end acknowledgements, drop_newest for raw lines); azure/tests/run.sh fails when the
# buffer or acknowledgement settings here differ from the real sink templates, because the
# restart and mode-change tests are only meaningful with the real settings.
# The DCR placeholders are unused here on purpose.
transforms:
  capture_events:
    type: remap
    inputs:
      - events_out
    source: |
      . = {"capture": "Custom-IbGwEvents_CL", "row": .}
  capture_metrics:
    type: remap
    inputs:
      - metrics_out
    source: |
      . = {"capture": "Custom-IbGwMetrics_CL", "row": .}
  capture_raw:
    type: remap
    inputs:
      - raw_out
    source: |
      . = {"capture": "Custom-IBGatewayLogs_CL", "row": .}

sinks:
  azure_events:
    type: console
    inputs:
      - capture_events
    target: stdout
    encoding:
      codec: json
    acknowledgements:
      enabled: true
    buffer:
      type: memory
      max_events: 500
      when_full: block
  azure_metrics:
    type: console
    inputs:
      - capture_metrics
    target: stdout
    encoding:
      codec: json
    acknowledgements:
      enabled: true
    buffer:
      type: memory
      max_events: 500
      when_full: block
  azure_raw:
    type: console
    inputs:
      - capture_raw
    target: stdout
    encoding:
      codec: json
    acknowledgements:
      enabled: true
    buffer:
      type: memory
      max_events: 500
      when_full: drop_newest
