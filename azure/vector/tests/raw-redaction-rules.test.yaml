# Unit tests for the redaction RULES (redact.vrl and the user-name step of raw_gate), with the
# bypass cases an independent review found. Run by azure/tests/run.sh with
# IBGW_RAW_MODE=redacted and IBGW_REDACT_USERNAME=CANARY_USER_zq7. Every identifier is a canary.
tests:
  - name: redaction - an account id next to an underscore, glued to a word, after an escaped line break or in lower case is caught
    inputs:
      - insert_at: raw_gate
        type: vrl
        source: |
          .message = "a _U1234567 b U7654321_x c acctDU1234567 d " + "\\" + "nU1111111 e " + "\\" + "tDU2222222 f u3333333 g du4444444 h U5555555. i (U6666666) j \"U7777777\" k U8888888/9 l =U9999999; m " + "\\" + "ndf4040404"
          .file = "/var/log/ibgateway/ibc/ibc.log"
          .timestamp = now()
    outputs:
      - extract_from: raw_out
        conditions:
          - type: vrl
            source: |
              assert_eq!(.RawData, "a _[ACCT:…567] b [ACCT:…321]_x c acct[ACCT:…567] d " + "\\" + "n[ACCT:…111] e " + "\\" + "t[ACCT:…222] f [ACCT:…333] g [ACCT:…444] h [ACCT:…555]. i ([ACCT:…666]) j \"[ACCT:…777]\" k [ACCT:…888]/9 l =[ACCT:…999]; m " + "\\" + "n[ACCT:…404]")

  - name: redaction - ordinary words, versions, hashes and long numbers are left alone
    inputs:
      - insert_at: raw_gate
        type: log
        log_fields:
          file: /var/log/ibgateway/jts/launcher.log
          message: "build U1234 XDU1234567 U1234567890 menu1234567 config_hash c7c60feb79adfd61 digest f67ff624e9d565e8 f1234567abc 10.50.1g FUTURES Du12 port 4002 snake_case_name __init__"
    outputs:
      - extract_from: raw_out
        conditions:
          - type: vrl
            source: |
              assert_eq!(.RawData, "build U1234 XDU1234567 U1234567890 menu1234567 config_hash c7c60feb79adfd61 digest f67ff624e9d565e8 f1234567abc 10.50.1g FUTURES Du12 port 4002 snake_case_name __init__")

  - name: redaction - the user name is replaced whatever its case, also glued to other text and repeated
    inputs:
      - insert_at: raw_gate
        type: log
        log_fields:
          file: /var/log/ibgateway/ibc/ibc.log
          message: "exact CANARY_USER_zq7 lower canary_user_zq7 upper CANARY_USER_ZQ7 title Canary_User_Zq7 mixed canary_USER_zq7 glued xCaNaRy_UsEr_Zq7y twice CANARY_USER_zq7canary_user_zq7 key=CANARY_USER_zq7; é-CANARY_USER_zq7-ü"
    outputs:
      - extract_from: raw_out
        conditions:
          - type: vrl
            source: |
              assert_eq!(.RawData, "exact [USER] lower [USER] upper [USER] title [USER] mixed [USER] glued x[USER]y twice [USER][USER] key=[USER]; é-[USER]-ü")
              assert!(!contains(downcase(encode_json(.)), "canary_user_zq7"), "user name shipped")

  - name: redaction - an event message with an id behind an underscore is redacted too
    inputs:
      - insert_at: events_row
        type: vrl
        source: |
          .file = "/var/log/ibgateway/events/events.jsonl"
          .message = encode_json({
            "ts": format_timestamp!(now(), "%Y-%m-%d") + "T00:00:00.456Z",
            "src": "ibc", "level": "warn", "event": "unknown_window", "msg": "window acct_DU1234567 and du7654321",
            "data": {"title": "id=u0001234"}, "boot_id": "443d261aecbd4789", "seq": 12
          })
    outputs:
      - extract_from: events_out
        conditions:
          - type: vrl
            source: |
              assert_eq!(.Msg, "window acct_[ACCT:…567] and [ACCT:…321]")
              assert_eq!(.Props.title, "id=[ACCT:…234]")

  # Found in a real paper session on 2026-11-16: the account id had the shape DU, one more
  # letter, six digits, and IBC logs it in the title of the configuration window. The pattern
  # of the time (DU, DF, U or F directly followed by the digits) did not match it.
  - name: redaction - the window title of a paper account (DU, a third letter, six digits) is redacted
    inputs:
      - insert_at: raw_gate
        type: log
        log_fields:
          file: /var/log/ibgateway/ibc/ibc.log
          message: "2026-11-16 09:00:00:000 IBC: detected dialog entitled: DUR123456 Trader Workstation Configuration (Simulated Trading); event=Opened"
    outputs:
      - extract_from: raw_out
        conditions:
          - type: vrl
            source: |
              assert_eq!(.RawData, "2026-11-16 09:00:00:000 IBC: detected dialog entitled: [ACCT:…456] Trader Workstation Configuration (Simulated Trading); event=Opened")
              assert!(!contains(encode_json(.), "DUR123456"), "full account id shipped")

  - name: redaction - an id with one or two further letters after the prefix, or with the prefix I, is caught in every position
    inputs:
      - insert_at: raw_gate
        type: vrl
        source: |
          .message = "a DUAB1234567 b I1234567 c UX12345 d dur123456 e i7654321 f acctDUR234567 g acct_DUR345678_x h " + "\\" + "nDUR456789 i " + "\\" + "tux56789 j =FAB98765; k (di123456) l DI654321."
          .file = "/var/log/ibgateway/ibc/ibc.log"
          .timestamp = now()
    outputs:
      - extract_from: raw_out
        conditions:
          - type: vrl
            source: |
              assert_eq!(.RawData, "a [ACCT:…567] b [ACCT:…567] c [ACCT:…345] d [ACCT:…456] e [ACCT:…321] f acct[ACCT:…567] g acct_[ACCT:…678]_x h " + "\\" + "n[ACCT:…789] i " + "\\" + "t[ACCT:…789] j =[ACCT:…765]; k ([ACCT:…456]) l [ACCT:…321].")

  # First letter not D, U, F or I; an id behind another capital letter; ten digits; a third
  # further letter; four digits; a four-letter word; an id followed by letters.
  - name: redaction - a word that differs from the shape of an id in one respect is left alone
    inputs:
      - insert_at: raw_gate
        type: log
        log_fields:
          file: /var/log/ibgateway/jts/launcher.log
          message: "XYZ123456 CPU12345 XDUR123456 DUR1234567890 DUABC123456 UABC12345 DUR1234 fuse1234567 wolf100234 dur123456abc"
    outputs:
      - extract_from: raw_out
        conditions:
          - type: vrl
            source: |
              assert_eq!(.RawData, "XYZ123456 CPU12345 XDUR123456 DUR1234567890 DUABC123456 UABC12345 DUR1234 fuse1234567 wolf100234 dur123456abc")

  # The price of recognising ids by shape, accepted on purpose: masking such a word costs
  # readability, missing an account id breaks the promise.
  - name: redaction - a word with the shape of an id is rewritten although it is none
    inputs:
      - insert_at: raw_gate
        type: log
        log_fields:
          file: /var/log/ibgateway/jts/launcher.log
          message: "id12345 USD100000 fix12345 disk12345 uk100234"
    outputs:
      - extract_from: raw_out
        conditions:
          - type: vrl
            source: |
              assert_eq!(.RawData, "[ACCT:…345] [ACCT:…000] [ACCT:…345] [ACCT:…345] [ACCT:…234]")

  - name: redaction - an event that carries the window title of a paper account is redacted too
    inputs:
      - insert_at: events_row
        type: vrl
        source: |
          .file = "/var/log/ibgateway/events/events.jsonl"
          .message = encode_json({
            "ts": format_timestamp!(now(), "%Y-%m-%d") + "T00:00:00.456Z",
            "src": "ibc", "level": "warn", "event": "unknown_window",
            "msg": "unknown window: DUR123456 Trader Workstation Configuration (Simulated Trading)",
            "data": {"title": "dur123456 Trader Workstation Configuration"}, "boot_id": "443d261aecbd4789", "seq": 13
          })
    outputs:
      - extract_from: events_out
        conditions:
          - type: vrl
            source: |
              assert_eq!(.Msg, "unknown window: [ACCT:…456] Trader Workstation Configuration (Simulated Trading)")
              assert_eq!(.Props.title, "[ACCT:…456] Trader Workstation Configuration")
              assert!(!contains(downcase(encode_json(.)), "dur123456"), "full account id shipped")

  # The boundaries of the shape, rule by rule (first review of 2026-11-16: rules 2 and 3 had
  # no test of their own, and a rule-2 pattern with {0,1} instead of {0,2} shipped
  # acctDUAB1234567 in full). Each token below differs from its neighbours in one respect:
  # two further letters, the prefix I, 5 and 9 digits are caught; 4 and 10 digits, a third
  # further letter, another first letter and a letter after the digits are not.
  - name: redaction - rule 1, an id standing on its own, at each boundary of the shape
    inputs:
      - insert_at: raw_gate
        type: log
        log_fields:
          file: /var/log/ibgateway/jts/launcher.log
          message: "a DUAB1234567 b duab7654321 c I1234567 d di123456 e U12345 f u123456789 g FAB98765 h DUR1234 i u1234567890 j DUABC123456 k Q1234567 l DUR123456x m U1234567F"
    outputs:
      - extract_from: raw_out
        conditions:
          - type: vrl
            source: |
              assert_eq!(.RawData, "a [ACCT:…567] b [ACCT:…321] c [ACCT:…567] d [ACCT:…456] e [ACCT:…345] f [ACCT:…789] g [ACCT:…765] h DUR1234 i u1234567890 j DUABC123456 k Q1234567 l DUR123456x m U1234567F")

  # Rule 2 is upper case only (the id and its further letters): lower-case words in front of
  # digits (menu1234567, acctdur123456) are everyday text, and IBKR prints ids in capitals.
  - name: redaction - rule 2, an id in upper case glued to a lower-case word, at each boundary of the shape
    inputs:
      - insert_at: raw_gate
        type: log
        log_fields:
          file: /var/log/ibgateway/jts/launcher.log
          message: "a acctDUAB1234567 b acctI1234567 c acctDI123456 d acctU12345 e acctU123456789 f acctFAB98765 g acctDUR1234 h acctU1234567890 i acctDUABC123456 j acctQ1234567 k acctDUR123456x l acctDUr123456 m acctdur123456"
    outputs:
      - extract_from: raw_out
        conditions:
          - type: vrl
            source: |
              assert_eq!(.RawData, "a acct[ACCT:…567] b acct[ACCT:…567] c acct[ACCT:…456] d acct[ACCT:…345] e acct[ACCT:…789] f acct[ACCT:…765] g acctDUR1234 h acctU1234567890 i acctDUABC123456 j acctQ1234567 k acctDUR123456x l acctDUr123456 m acctdur123456")

  # Rule 3 in any case after an escaped \n, \r or \t. The ids here are not all capitals: after
  # the letter n, r or t an upper-case id is caught by rule 2 already, so only these tell
  # whether rule 3 itself works.
  - name: redaction - rule 3, an id after an escaped line break, carriage return or tab, at each boundary of the shape
    inputs:
      - insert_at: raw_gate
        type: vrl
        source: |
          bs = "\\"
          .message = "a " + bs + "nduab1234567 b " + bs + "ri1234567 c " + bs + "tdi123456 d " + bs + "nu12345 e " + bs + "ru123456789 f " + bs + "tfab98765 g " + bs + "rDur654321 h " + bs + "ndur1234 i " + bs + "nu1234567890 j " + bs + "nduabc123456 k " + bs + "nq1234567 l " + bs + "ndur123456x"
          .file = "/var/log/ibgateway/ibc/ibc.log"
          .timestamp = now()
    outputs:
      - extract_from: raw_out
        conditions:
          - type: vrl
            source: |
              bs = "\\"
              assert_eq!(.RawData, "a " + bs + "n[ACCT:…567] b " + bs + "r[ACCT:…567] c " + bs + "t[ACCT:…456] d " + bs + "n[ACCT:…345] e " + bs + "r[ACCT:…789] f " + bs + "t[ACCT:…765] g " + bs + "r[ACCT:…321] h " + bs + "ndur1234 i " + bs + "nu1234567890 j " + bs + "nduabc123456 k " + bs + "nq1234567 l " + bs + "ndur123456x")

  # Digits are ASCII digits, as in the label patterns of entrypoint.sh and apply-config.sh:
  # Rust's \d also matches other scripts' digits (Arabic-Indic, full-width), which no IBKR id
  # uses, so the shape would differ between the redaction and the label check.
  - name: redaction - digits of other scripts are not account-id digits
    inputs:
      - insert_at: raw_gate
        type: log
        log_fields:
          file: /var/log/ibgateway/jts/launcher.log
          message: "a U١٢٣٤٥٦٧ b DUR１２３４５６ c acctU٠١٢٣٤٥ d U1234567"
    outputs:
      - extract_from: raw_out
        conditions:
          - type: vrl
            source: |
              assert_eq!(.RawData, "a U١٢٣٤٥٦٧ b DUR１２３４５６ c acctU٠١٢٣٤٥ d [ACCT:…567]")
