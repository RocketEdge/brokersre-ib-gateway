# Lint, build the stable channel for amd64, run the unit suite inside the image, run the
# container tests offline, scan with Trivy. No IBKR credentials exist here and the IBC smoke test
# runs with --network none, so nothing ever contacts IBKR's login servers.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml
      - name: shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck --version | head -2
          shellcheck -x rootfs/usr/local/bin/*.sh rootfs/usr/local/lib/brokersre/*.sh scripts/*.sh tests/bats/*.sh tests/container/*.sh tests/compose/*.sh examples/*.sh
      - name: shfmt (diff only)
        run: docker run --rm -v "$PWD:/work" -w /work mvdan/shfmt:v3.14.1 -i 2 -ci -bn -d rootfs scripts tests/container tests/compose tests/bats/run-in-image.sh examples/wait-for-gateway.sh
      - name: versions.json sanity
        run: |
          jq -e '.schema_version == 1' versions.json
          jq -e '[.ibc.sha256, .channels.stable.sha256.x64, .channels.stable.sha256.arm, .channels.latest.sha256.x64, .channels.latest.sha256.arm] | all(test("^[0-9a-f]{64}$"))' versions.json
          jq -e '.base.digest | test("^sha256:[0-9a-f]{64}$")' versions.json
          jq -e '[.channels.stable.version, .channels.latest.version] | all(test("^10\\.[0-9]+\\.[0-9]+[a-z]?$"))' versions.json
      - name: README version table matches versions.json
        run: scripts/readme-versions.sh --check
      - name: bake definition resolves
        run: |
          eval "$(scripts/bake-env.sh)"
          docker buildx bake --print stable latest > /dev/null
      - name: CI script tests (bats, release policy and archive prefetch)
        run: |
          git clone -q --depth 1 -b v1.14.0 https://github.com/bats-core/bats-core tests/.bats-core
          tests/.bats-core/bin/bats tests/bats/ci

  build-test:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # Trivy SARIF upload
      actions: read          # upload-sarif reads the run for telemetry
    env:
      # Named TEST_IMAGE on purpose: bake reads a variable called IMAGE from the environment.
      TEST_IMAGE: ghcr.io/rocketedge/brokersre-ib-gateway:stable
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Pre-fetch archived stable installers (IBKR serves only its newest build)
        # Without this, every build of main fails from the day IBKR moves past the pinned version
        # until the bump merges (2026-11-11). Copies are used only when they match the pin.
        env:
          GH_TOKEN: ${{ secrets.ARCHIVE_READ_TOKEN }}
        run: |
          eval "$(scripts/bake-env.sh)"
          scripts/prefetch-installers.sh stable "$STABLE_VERSION" "$STABLE_SHA256_X64" "$STABLE_SHA256_ARM" downloads
      - name: Build stable (amd64) and load
        run: |
          eval "$(scripts/bake-env.sh)"
          docker buildx bake stable --set '*.platform=linux/amd64' --set '*.cache-from=type=gha' --set '*.cache-to=type=gha,mode=max' --load
      - name: Unit suite inside the image (bats)
        run: |
          git clone -q --depth 1 -b v1.14.0 https://github.com/bats-core/bats-core tests/.bats-core
          tests/bats/run-in-image.sh "$TEST_IMAGE"
      - name: Container tests (offline)
        run: IMAGE="$TEST_IMAGE" tests/container/run.sh
      - name: Compose tests (several gateways, gateway + strategy; offline)
        run: IMAGE="$TEST_IMAGE" tests/compose/run.sh
      # CI builds and scans linux/amd64 only: an arm64 build under emulation is too slow for a
      # pull request. publish.yml scans both platforms of the exact digest it publishes, with
      # this same gate, before any tag moves.
      - name: Trivy gate (fixable CRITICAL/HIGH in OS packages)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.TEST_IMAGE }}
          format: sarif
          output: trivy.sarif
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # OS packages are what this image can patch. IBKR's bundled jars are reported by the
          # next step but not gated: see docs/limitations.md L08.
          vuln-type: os
      - name: Trivy report of IBKR-bundled jars (not gated, docs/limitations.md L08)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.TEST_IMAGE }}
          vuln-type: library
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      # The VEX document states this project's position on every CVE of the bundled jars
      # (security/vex/, docs/limitations.md L08). The check names findings without a statement
      # and statements without a finding. It needs the unfiltered list (no severity filter, no
      # ignore-unfixed) and never fails the job: a CVE published today must not block a pull
      # request that has nothing to do with it. The document's own validity is gated by the
      # bats suite of the lint job.
      - name: Trivy JSON of the bundled jars (input of the VEX drift check)
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.TEST_IMAGE }}
          vuln-type: library
          format: json
          output: trivy-library.json
          exit-code: "0"
          list-all-pkgs: "true"
      - name: VEX drift check (not gated, docs/limitations.md L08)
        if: always()
        run: |
          rc=0
          scripts/check-vex.sh security/vex/ibgateway-vendor-jars.openvex.json trivy-library.json || rc=$?
          case "$rc" in
            0) ;;
            1) echo "::warning title=VEX drift::security/vex/ibgateway-vendor-jars.openvex.json and Trivy's findings for the bundled jars differ; see the MISSING and STALE lines of this step. CI scans the stable channel only: a statement that is STALE here may belong to the latest channel." ;;
            *) echo "::warning title=VEX drift check did not run::scripts/check-vex.sh exited $rc; see this step's log." ;;
          esac
      - name: Upload Trivy SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4.39.3
        with:
          sarif_file: trivy.sarif

  # The sample clients under examples/ are read-only and are tested against stand-ins: no job
  # here has IBKR credentials or contacts IBKR.
  examples-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/python
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run black --check .
      - run: uv run mypy
      - run: uv run pytest

  examples-csharp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/csharp
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: examples/csharp/global.json
      - run: dotnet build -warnaserror
      - run: dotnet test
      - run: dotnet format GatewayClient.slnx --verify-no-changes
