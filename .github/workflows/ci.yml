# Lint, build the stable channel for amd64 with the build helper (scripts/build-image.sh, which
# follows IBKR's channel when IBKR is ahead of the pin, ADR 0018), run the unit suite inside the
# image, run the container tests offline, scan with Trivy, test the PowerShell build wrapper.
# Every test reads the image built in the job, never RocketEdge's published image (not public,
# ADR 0018), so a pull request from a fork runs the same jobs. No IBKR credentials exist here and the IBC smoke test runs with --network none, so nothing
# ever contacts IBKR's login servers (the installer is downloaded from IBKR's public URL).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml
      - name: hadolint (the build helper's image)
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: scripts/build-helper/Dockerfile
          config: .hadolint.yaml
      - name: shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck --version | head -2
          shellcheck -x rootfs/usr/local/bin/*.sh rootfs/usr/local/lib/brokersre/*.sh scripts/*.sh tests/bats/*.sh tests/container/*.sh tests/compose/*.sh tests/recipes/*.sh examples/*.sh
      - name: shfmt (diff only)
        run: docker run --rm -v "$PWD:/work" -w /work mvdan/shfmt:v3.14.1 -i 2 -ci -bn -d rootfs scripts tests/container tests/compose tests/recipes tests/bats/run-in-image.sh examples/wait-for-gateway.sh
      - name: versions.json sanity
        run: |
          jq -e '.schema_version == 1' versions.json
          jq -e '[.ibc.sha256, .channels.stable.sha256.x64, .channels.stable.sha256.arm, .channels.latest.sha256.x64, .channels.latest.sha256.arm] | all(test("^[0-9a-f]{64}$"))' versions.json
          jq -e '.base.digest | test("^sha256:[0-9a-f]{64}$")' versions.json
          jq -e '[.channels.stable.version, .channels.latest.version] | all(test("^10\\.[0-9]+\\.[0-9]+[a-z]?$"))' versions.json
          # IBKR's build time of each pin: the Dockerfile checks the installed Gateway's stamp
          # against it (scripts/bake-env.sh, fetch-installer.sh --check-stamp).
          jq -e '[.channels.stable.build_datetime, .channels.latest.build_datetime] | all(type == "string" and test("^[0-9]{8} [0-9]{2}:[0-9]{2}:[0-9]{2}$"))' versions.json
      - name: README version table matches versions.json
        run: scripts/readme-versions.sh --check
      - name: Every tracked shell script carries the execute bit (a Windows host does not record it)
        run: |
          set -euo pipefail
          git ls-files -s | scripts/check-file-modes.sh
      - name: bake definition resolves, and the two channels claim no common tag
        run: |
          set -euo pipefail
          eval "$(scripts/bake-env.sh)"
          docker buildx bake --print stable latest | scripts/check-bake-tags.sh
      - name: CI script tests in bats (release and rebuild policy, tag promotion, VEX drift, workflow policy, documented commands)
        run: |
          # doc-commands.bats types into the documented secret blocks under bash, zsh (the macOS
          # default shell) and sh through a pty; the runner has bash, dash and python3, not zsh.
          # The package lists come from the shellcheck step above.
          sudo apt-get install -y --no-install-recommends zsh
          zsh --version
          git clone -q --depth 1 -b v1.14.0 https://github.com/bats-core/bats-core tests/.bats-core
          tests/.bats-core/bin/bats tests/bats/ci

  build-test:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # Trivy SARIF upload
      actions: read          # upload-sarif reads the run for telemetry
    env:
      # Named TEST_IMAGE on purpose: bake reads a variable called IMAGE from the environment.
      # A name without a registry (the build helper's default tag): every step tests the image
      # this job built from the commit. RocketEdge's own image is not public (ADR 0018) and a pull
      # request from a fork can never read it; under this name nothing can be pulled in place
      # of the build, not even by accident (Docker Hub has no library image of that name).
      TEST_IMAGE: brokersre-ib-gateway:stable
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build stable (amd64) with the build helper, and its IBC smoke test
        # The way users build (ADR 0018): the pin when IBKR serves it, otherwise IBKR's newer
        # build checked against IBKR's own stamp and labelled not qualified. A bake build of the
        # pin failed every pull request from the day IBKR moved on (2026-11-11, 2026-11-17)
        # unless the private archive held the pinned installer. The summary lines are printed
        # last; a build the project has not qualified is also announced as a notice.
        run: |
          set -euo pipefail
          scripts/build-image.sh --channel stable --platform linux/amd64 --tag "$TEST_IMAGE" > build-summary.txt
          cat build-summary.txt
          if grep -qx 'qualified_by_project: no' build-summary.txt; then
            built="$(sed -n 's/^version: //p' build-summary.txt)"
            pinned="$(jq -r .channels.stable.version versions.json)"
            echo "::notice title=Gateway build not qualified::CI built IB Gateway ${built} (IBKR's stable channel); versions.json pins ${pinned}. The image is labelled qualified=no (docs/limitations.md L35)."
          fi
      - name: Unit suite inside the image (bats)
        run: |
          git clone -q --depth 1 -b v1.14.0 https://github.com/bats-core/bats-core tests/.bats-core
          tests/bats/run-in-image.sh "$TEST_IMAGE"
      - name: Container tests (offline)
        run: IMAGE="$TEST_IMAGE" tests/container/run.sh
      - name: Compose tests (several gateways, gateway + strategy; offline)
        run: IMAGE="$TEST_IMAGE" tests/compose/run.sh
      # CI builds and scans linux/amd64 only: an arm64 build under emulation is too slow for a
      # pull request. publish.yml scans both platforms of the exact digest it publishes, with
      # this same gate, before any tag moves.
      # TRIVY_IMAGE_SRC=docker on the three scanner steps: Trivy reads the image this job built
      # from the local daemon and never falls back to a registry (its default order ends with
      # `remote`), so a missing build fails the step instead of scanning something else.
      - name: Trivy gate (fixable CRITICAL/HIGH in OS packages)
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_IMAGE_SRC: docker
        with:
          version: v0.76.2
          image-ref: ${{ env.TEST_IMAGE }}
          format: sarif
          output: trivy.sarif
          exit-code: "1"
          severity: CRITICAL,HIGH
          # Without this the action drops the severity filter whenever the format is SARIF
          # (its README: "SARIF format enforces output of all vulnerabilities regardless of
          # configured severities"), and the gate would fail on a fixable LOW finding too.
          limit-severities-for-sarif: "true"
          ignore-unfixed: true
          # OS packages are what this image can patch. IBKR's bundled jars are reported by the
          # next step but not gated: see docs/limitations.md L08.
          vuln-type: os
      - name: Trivy report of IBKR-bundled jars (not gated, docs/limitations.md L08)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_IMAGE_SRC: docker
        with:
          version: v0.76.2
          image-ref: ${{ env.TEST_IMAGE }}
          vuln-type: library
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      # The VEX document states this project's position on every CVE of the bundled jars
      # (security/vex/, docs/limitations.md L08). The check names findings without a statement
      # and statements without a finding. It needs the unfiltered list (no severity filter, no
      # ignore-unfixed) and never fails the job: a CVE published today must not block a pull
      # request that has nothing to do with it. The document's own validity is gated by the
      # bats suite of the lint job.
      - name: Trivy JSON of the bundled jars (input of the VEX drift check)
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_IMAGE_SRC: docker
        with:
          version: v0.76.2
          image-ref: ${{ env.TEST_IMAGE }}
          vuln-type: library
          format: json
          output: trivy-library.json
          exit-code: "0"
          list-all-pkgs: "true"
      - name: VEX drift check (not gated, docs/limitations.md L08)
        if: always()
        run: |
          rc=0
          scripts/check-vex.sh security/vex/ibgateway-vendor-jars.openvex.json trivy-library.json || rc=$?
          case "$rc" in
            0) ;;
            1) echo "::warning title=VEX drift::security/vex/ibgateway-vendor-jars.openvex.json and Trivy's findings for the bundled jars differ; see the MISSING and STALE lines of this step. CI scans the stable channel only: a statement that is STALE here may belong to the latest channel." ;;
            *) echo "::warning title=VEX drift check did not run::scripts/check-vex.sh exited $rc; see this step's log." ;;
          esac
      - name: Upload Trivy SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4.39.3
        with:
          sarif_file: trivy.sarif

  # scripts/build-image.ps1 under both PowerShell editions it supports (Windows PowerShell 5.1,
  # PowerShell 7), with docker mocked, and PSScriptAnalyzer with the Windows kit's settings.
  # What runs in the helper container is tested by tests/bats/ci/build-image.bats (lint job).
  build-image-ps1:
    name: PowerShell build wrapper (${{ matrix.shell }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      PESTER_VERSION: "6.2.0"
      PSSCRIPTANALYZER_VERSION: "1.25.0"
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Pester and PSScriptAnalyzer
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          if ($PSVersionTable.PSEdition -eq 'Desktop') { Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Scope CurrentUser -Force | Out-Null }
          Install-Module -Name Pester -RequiredVersion $env:PESTER_VERSION -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module -Name PSScriptAnalyzer -RequiredVersion $env:PSSCRIPTANALYZER_VERSION -Scope CurrentUser -Force
      - name: Pester (scripts/tests)
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module -Name Pester -RequiredVersion $env:PESTER_VERSION
          '{0} {1}, Pester {2}' -f $PSVersionTable.PSEdition, $PSVersionTable.PSVersion, (Get-Module Pester).Version
          $config = New-PesterConfiguration
          $config.Run.Path = 'scripts/tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config
      - name: PSScriptAnalyzer (scripts)
        if: matrix.shell == 'pwsh'
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module -Name PSScriptAnalyzer -RequiredVersion $env:PSSCRIPTANALYZER_VERSION
          $findings = @(Invoke-ScriptAnalyzer -Path scripts -Recurse -Settings windows/PSScriptAnalyzerSettings.psd1 -ErrorVariable ruleErrors -ErrorAction SilentlyContinue)
          $findings | ForEach-Object { '{0}:{1} [{2}/{3}] {4}' -f $_.ScriptName, $_.Line, $_.Severity, $_.RuleName, $_.Message }
          $ruleErrors | ForEach-Object { 'RULE ERROR: {0} {1}' -f $_.TargetObject, $_.Exception.Message }
          'findings: {0}, rule errors: {1}' -f $findings.Count, $ruleErrors.Count
          if ($findings.Count -gt 0 -or $ruleErrors.Count -gt 0) { exit 1 }

  # The log-shipper recipes under docs/recipes: `vector validate`, then an offline run against a
  # stand-in receiver. Needs only Docker; it does not use the gateway image and contacts no
  # log service.
  recipes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Log-shipper recipes (Vector, validate, then an offline run against a stand-in)
        run: tests/recipes/run.sh

  # The sample clients under examples/ are read-only and are tested against stand-ins: no job
  # here has IBKR credentials or contacts IBKR.
  examples-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/python
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run black --check .
      - run: uv run mypy
      - run: uv run pytest

  examples-csharp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/csharp
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: examples/csharp/global.json
      - run: dotnet build -warnaserror
      - run: dotnet test
      - run: dotnet format GatewayClient.slnx --verify-no-changes
