# Azure Log Analytics pack: everything azure/tests/run.sh checks, offline. No Azure login, no
# secret, no deployment: Vector runs with --network none on fixtures and Bicep is only compiled.
# Tool images are pinned in azure/tests/run.sh; the Vector image is the one the compose
# override pins. Bicep is pinned here to the version the templates were written against.
name: Azure pack

on:
  push:
    branches: [main]
    paths:
      - "azure/**"
      - "compose/docker-compose.azure.yml"
      - "compose/docker-compose.example.yml" # the override merges with the reference file
      - ".github/workflows/azure-pack.yml"
  pull_request:
    paths:
      - "azure/**"
      - "compose/docker-compose.azure.yml"
      - "compose/docker-compose.example.yml"
      - ".github/workflows/azure-pack.yml"

permissions:
  contents: read

concurrency:
  group: azure-pack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  azure-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BICEP_VERSION: v0.49.2
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Tools
        run: |
          docker version --format 'docker {{.Server.Version}}'
          docker compose version
          jq --version
          # The pinned Bicep; no "a newer release is available" notice in the build output.
          az config set bicep.check_version=False
          az bicep install --version "${BICEP_VERSION}"
          az bicep version
      # Every group runs even when an earlier one failed: one run then shows all that is wrong,
      # instead of one failure per push. A failed step still fails the job.
      - name: Vector validate and VRL unit tests (the pinned image), entrypoint refusals
        run: azure/tests/run.sh vector entrypoint
      - name: Shipper on lines of a real gateway run (real container, no network) and schema drift against the compiled Bicep
        if: ${{ !cancelled() }}
        run: azure/tests/run.sh pipeline drift
      - name: Bicep build and lint, parameter files, compiled-template checks (roles, network rules, userData)
        if: ${{ !cancelled() }}
        run: azure/tests/run.sh bicep
      # Static analysis only: the queries and the scenario timelines are type-checked against
      # the deployed schema. Executing them (group kql-run) needs Microsoft's Kusto emulator,
      # whose licence terms must be accepted first (KUSTO_EMULATOR_EULA=accept); that is a
      # decision for the repository owner, so it is not set here and the group is not run.
      - name: KQL static analysis of alert rules, query pack, workbook and scenario timelines
        if: ${{ !cancelled() }}
        run: azure/tests/run.sh kql
      - name: Compose config of the override
        if: ${{ !cancelled() }}
        run: azure/tests/run.sh compose
      - name: The VM's host scripts with fake curl, docker and git; shellcheck, shfmt, YAML/JSON, actionlint
        if: ${{ !cancelled() }}
        run: azure/tests/run.sh secrets lint
