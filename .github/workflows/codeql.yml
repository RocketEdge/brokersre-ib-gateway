# CodeQL for the workflow files (the only CodeQL-supported language here). Free on public repos.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "15 5 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: github/codeql-action/init@v4.39.1
        with:
          languages: actions
          build-mode: none
      - uses: github/codeql-action/analyze@v4.39.1
        with:
          category: "/language:actions"
