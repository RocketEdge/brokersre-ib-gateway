# Qualify an image with one real login to an IBKR PAPER account (ADR 0014).
#
# This is the only workflow that contacts IBKR's login servers. It is never started by a push or
# a pull request: a person dispatches it, and the environment `paper-qualification` holds the
# paper credentials behind a required reviewer and accepts deployments from `main` only, so a
# pull request (including one from a fork) cannot reach them. One run makes exactly one login
# attempt and never answers a second factor (scripts/qualify-paper.sh).
name: Qualify (paper login)

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Image to qualify, by digest: ghcr.io/rocketedge/brokersre-ib-gateway@sha256:..."
        required: true
        type: string
      attest:
        description: "When qualified, attach the result to the image as a signed attestation"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# IBKR allows one session per username: two qualifications must never log in at the same time.
concurrency:
  group: paper-qualification
  cancel-in-progress: false

jobs:
  qualify:
    name: one paper login
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: paper-qualification
    permissions:
      contents: read
      packages: write # cosign stores the attestation next to the image (only with `attest`)
      id-token: write # keyless signing of the attestation
    env:
      IMAGE: ${{ inputs.image }}
    steps:
      - name: Only from main, only by digest
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::dispatch this workflow from main (got ${GITHUB_REF})"
            exit 1
          fi
          if ! [[ "${IMAGE}" =~ ^ghcr\.io/rocketedge/brokersre-ib-gateway@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::give the image by digest: ghcr.io/rocketedge/brokersre-ib-gateway@sha256:<64 hex>"
            exit 1
          fi
      - uses: actions/checkout@v7.0.1
      - name: Write the paper credentials to files
        env:
          PAPER_USERID: ${{ secrets.PAPER_USERID }}
          PAPER_PASSWORD: ${{ secrets.PAPER_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${PAPER_USERID}" ] || [ -z "${PAPER_PASSWORD}" ]; then
            echo "::error::PAPER_USERID and PAPER_PASSWORD must be set as secrets of the paper-qualification environment"
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/secrets"
          # printf is a shell builtin: the values never appear in a process argument list.
          printf '%s' "${PAPER_USERID}" >"${RUNNER_TEMP}/secrets/ib-username"
          printf '%s' "${PAPER_PASSWORD}" >"${RUNNER_TEMP}/secrets/ib-password"
          # uid 1000 inside the container must be able to read the bind-mounted files.
          chmod 0755 "${RUNNER_TEMP}/secrets"
          chmod 0644 "${RUNNER_TEMP}/secrets/ib-username" "${RUNNER_TEMP}/secrets/ib-password"
      - name: Pull the image
        run: docker pull "${IMAGE}"
      - name: Qualify (one login attempt; approve a second factor on the phone if IBKR asks)
        run: scripts/qualify-paper.sh --image "${IMAGE}" --secrets-dir "${RUNNER_TEMP}/secrets" --out qualify-out
      - name: Remove the credential files
        if: always()
        run: rm -rf "${RUNNER_TEMP}/secrets"
      - name: Show the result
        if: always()
        run: |
          if [ -f qualify-out/result.json ]; then cat qualify-out/result.json >>"${GITHUB_STEP_SUMMARY}"; cat qualify-out/result.json; fi
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: qualification
          path: |
            qualify-out/result.json
            qualify-out/events.jsonl
          if-no-files-found: warn
          retention-days: 90
      - uses: sigstore/cosign-installer@v4.1.3
        if: success() && inputs.attest
      - uses: docker/login-action@v4.8.0
        if: success() && inputs.attest
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Attach the result to the image as a signed attestation
        if: success() && inputs.attest
        run: |
          set -euo pipefail
          cosign attest --yes \
            --type https://github.com/RocketEdge/brokersre-ib-gateway/attestations/qualified-paper/v1 \
            --predicate qualify-out/result.json "${IMAGE}"
          cosign verify-attestation \
            --type https://github.com/RocketEdge/brokersre-ib-gateway/attestations/qualified-paper/v1 \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/qualify-paper.yml@${GITHUB_REF}" \
            "${IMAGE}" >/dev/null
          echo "qualified-paper attestation verified for ${IMAGE}"
