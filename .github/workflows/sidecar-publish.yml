# Build, test, scan, push, sign and attest the sidecar image whenever one of its inputs changes
# on main, or on demand. Both architectures are smoke-tested and scanned BEFORE anything is
# pushed, so a broken or vulnerable build never gets a tag. Consumers pin the digest printed in
# the job summary; tags are a convenience.
#
# Rules this workflow enforces:
#   - It publishes from refs/heads/main only. A manual run from any other ref fails at once,
#     and the signature is verified against the identity of this workflow AT main.
#   - An existing tag is never moved. A version tag names the first build of that version for
#     good; a later build of the same version is reachable as sha-<commit> only (bump the
#     version in sidecar/pyproject.toml to release it), and a security rebuild gets
#     <version>-rYYYYMMDD (input "rebuild", started weekly by sidecar-rescan.yml when the
#     published image has a fixable finding).
#   - Every build here is made without a layer cache, so the security-update layer of the
#     Dockerfile always sees today's Debian archive.
name: Sidecar publish

on:
  push:
    branches: [main]
    paths:
      - sidecar/src/**
      - sidecar/Dockerfile
      - sidecar/.dockerignore
      - sidecar/pyproject.toml
      - sidecar/uv.lock
      - .github/workflows/sidecar-publish.yml
  workflow_dispatch:
    inputs:
      rebuild:
        description: Security rebuild of the current version (tag <version>-rYYYYMMDD)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sidecar-publish
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/rocketedge/brokersre-ib-gateway-sidecar

jobs:
  refuse:
    name: refuse any ref but main
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail loudly instead of skipping silently
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::the sidecar image is published from refs/heads/main only; this run is for ${REF}"
          exit 1

  publish:
    # The condition keeps the registry and signing permissions away from every other ref.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write       # keyless signing (Sigstore) and provenance
      attestations: write
      security-events: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v4.4.0
        with:
          platforms: linux/amd64,linux/arm64
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve the version and the tags that do not exist yet
        id: vars
        env:
          REBUILD: ${{ inputs.rebuild }}
        run: |
          version="$(sed -n 's/^version = "\([0-9][0-9A-Za-z.+-]*\)"$/\1/p' sidecar/pyproject.toml | head -1)"
          if [ -z "$version" ]; then echo "::error::no version in sidecar/pyproject.toml"; exit 1; fi
          short="${GITHUB_SHA::12}"
          if [ "$REBUILD" = "true" ]; then
            wanted="${version}-r$(date -u +%Y%m%d)"
          else
            wanted="${version} sha-${short}"
          fi
          tags=""
          for tag in $wanted; do
            if out="$(docker buildx imagetools inspect "${IMAGE}:${tag}" 2>&1)"; then
              echo "::warning::${IMAGE}:${tag} exists already and is not moved"
            elif grep -qiE 'not found|manifest unknown|name unknown|403 forbidden|denied|unauthorized' <<<"$out"; then
              # "not found": the registry has no such tag (observed on ghcr.io for a missing
              # tag of an existing package). A refusal is what ghcr.io answers for a package
              # that does not exist yet, as on the first publish (observed: 403 on the token
              # request); if it ever meant "no access", the push below would be refused too,
              # so no tag can be moved by reading it as absent.
              tags="${tags}${IMAGE}:${tag}"$'\n'
            else
              # Anything else (a 5xx, a timeout) must not be read as "absent": the tag may
              # exist, and pushing would move it.
              echo "::error::cannot tell whether ${IMAGE}:${tag} exists: ${out}"
              exit 1
            fi
          done
          {
            echo "version=$version"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if [ -n "$tags" ]; then echo "publish=true"; else echo "publish=false"; fi
            echo "tags<<TAGS"
            printf '%s' "$tags"
            echo "TAGS"
          } >> "$GITHUB_OUTPUT"
          if [ -z "$tags" ]; then
            echo "::notice::every tag of this build exists already: the image is built, tested and scanned, and nothing is pushed"
          fi
      - name: Build amd64 and load for testing and scanning
        uses: docker/build-push-action@v7.4.0
        with:
          context: sidecar
          platforms: linux/amd64
          load: true
          pull: true
          no-cache: true
          tags: ${{ env.IMAGE }}:candidate-amd64
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.vars.outputs.created }}
          provenance: false
          sbom: false
      - name: Container smoke test, amd64, before anything is pushed
        run: IMAGE="$IMAGE:candidate-amd64" sidecar/tests/container/run.sh
      - name: Trivy gate, amd64 (fixable CRITICAL/HIGH, OS and libraries)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:candidate-amd64
          format: sarif
          output: trivy-sidecar-amd64.sarif
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
      - name: Upload Trivy SARIF (amd64)
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4.39.3
        with:
          sarif_file: trivy-sidecar-amd64.sarif
          category: sidecar-amd64
      - name: Build arm64 and load for testing and scanning
        uses: docker/build-push-action@v7.4.0
        with:
          context: sidecar
          platforms: linux/arm64
          load: true
          pull: true
          no-cache: true
          tags: ${{ env.IMAGE }}:candidate-arm64
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.vars.outputs.created }}
          provenance: false
          sbom: false
      - name: Container smoke test, arm64 under emulation, before anything is pushed
        run: IMAGE="$IMAGE:candidate-arm64" SMOKE_TIMEOUT_SCALE=5 sidecar/tests/container/run.sh
      - name: Trivy gate, arm64 (fixable CRITICAL/HIGH, OS and libraries)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:candidate-arm64
          format: sarif
          output: trivy-sidecar-arm64.sarif
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
      - name: Upload Trivy SARIF (arm64)
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4.39.3
        with:
          sarif_file: trivy-sidecar-arm64.sarif
          category: sidecar-arm64
      - name: Push both architectures (the layers that were just tested, from this job's cache)
        id: push
        if: steps.vars.outputs.publish == 'true'
        uses: docker/build-push-action@v7.4.0
        with:
          context: sidecar
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.vars.outputs.tags }}
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.vars.outputs.created }}
          # Signature, SBOM attestation and provenance are attached explicitly below.
          provenance: false
          sbom: false
      - name: SBOM (CycloneDX)
        if: steps.vars.outputs.publish == 'true'
        uses: anchore/sbom-action@v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-sidecar.cdx.json
          upload-artifact: true
          upload-release-assets: false
      - uses: sigstore/cosign-installer@v4.1.3
        if: steps.vars.outputs.publish == 'true'
      - name: Sign and attest (keyless)
        if: steps.vars.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign attest --yes --type cyclonedx --predicate sbom-sidecar.cdx.json "$IMAGE@$DIGEST"
      - name: Verify the signature and attestation just published (evidence in this log)
        if: steps.vars.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          # Exactly this workflow at main: a signature made from any other ref does not verify.
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/sidecar-publish.yml@refs/heads/main
        run: |
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "$IDENTITY" --output text
          cosign verify-attestation --type cyclonedx "$IMAGE@$DIGEST" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "$IDENTITY" > /dev/null && echo "cyclonedx attestation verified for $IMAGE@$DIGEST"
      - uses: actions/attest-build-provenance@v4.2.2
        if: steps.vars.outputs.publish == 'true'
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Summary (pin this digest)
        if: steps.vars.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          VERSION: ${{ steps.vars.outputs.version }}
          TAGS: ${{ steps.vars.outputs.tags }}
        run: |
          {
            echo "### brokersre-ib-gateway-sidecar $VERSION"
            echo
            echo "Pin this exact build: \`$IMAGE@$DIGEST\`"
            echo
            echo "Tags pushed (an existing tag is never moved):"
            echo
            echo '```text'
            echo "$TAGS"
            echo '```'
            echo
            echo "Verify: \`cosign verify $IMAGE@$DIGEST --certificate-oidc-issuer https://token.actions.githubusercontent.com --certificate-identity https://github.com/RocketEdge/brokersre-ib-gateway/.github/workflows/sidecar-publish.yml@refs/heads/main\`"
            echo
            echo "Interactive Brokers, IBKR, IB Gateway and Trader Workstation are trademarks of Interactive Brokers LLC. This project is not affiliated with, endorsed by or sponsored by Interactive Brokers."
          } >> "$GITHUB_STEP_SUMMARY"
