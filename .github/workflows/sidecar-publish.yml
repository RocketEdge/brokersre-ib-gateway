# Build, test, scan, push, sign and attest the sidecar image whenever one of its inputs changes
# on main, or on demand. The smoke test and the Trivy scan run on the amd64 build BEFORE
# anything is pushed, so a broken or vulnerable build never moves a tag. Consumers pin the
# digest printed in the job summary; tags are a convenience.
name: Sidecar publish

on:
  push:
    branches: [main]
    paths:
      - sidecar/src/**
      - sidecar/Dockerfile
      - sidecar/.dockerignore
      - sidecar/pyproject.toml
      - sidecar/uv.lock
      - .github/workflows/sidecar-publish.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sidecar-publish
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/rocketedge/brokersre-ib-gateway-sidecar

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write       # keyless signing (Sigstore) and provenance
      attestations: write
      security-events: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v4.4.0
        with:
          platforms: linux/amd64,linux/arm64
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve version, tags and labels
        id: vars
        run: |
          version="$(sed -n 's/^version = "\([0-9][0-9A-Za-z.+-]*\)"$/\1/p' sidecar/pyproject.toml | head -1)"
          if [ -z "$version" ]; then echo "no version in sidecar/pyproject.toml"; exit 1; fi
          {
            echo "version=$version"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "short=${GITHUB_SHA::12}"
          } >> "$GITHUB_OUTPUT"
      - name: Build amd64 and load for testing and scanning
        uses: docker/build-push-action@v7.4.0
        with:
          context: sidecar
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:candidate
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.vars.outputs.created }}
          cache-from: type=gha,scope=sidecar
          cache-to: type=gha,mode=max,scope=sidecar
          provenance: false
          sbom: false
      - name: Container smoke test before anything is pushed
        run: IMAGE="$IMAGE:candidate" sidecar/tests/container/run.sh
      - name: Trivy gate before anything is pushed (fixable CRITICAL/HIGH, OS and libraries)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:candidate
          format: sarif
          output: trivy-sidecar.sarif
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
      - name: Upload Trivy SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4.39.3
        with:
          sarif_file: trivy-sidecar.sarif
          category: sidecar
      - name: Build multi-arch and push
        id: push
        uses: docker/build-push-action@v7.4.0
        with:
          context: sidecar
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.vars.outputs.version }}
            ${{ env.IMAGE }}:sha-${{ steps.vars.outputs.short }}
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.vars.outputs.created }}
          cache-from: type=gha,scope=sidecar
          # Signature, SBOM attestation and provenance are attached explicitly below.
          provenance: false
          sbom: false
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-sidecar.cdx.json
          upload-artifact: true
          upload-release-assets: false
      - uses: sigstore/cosign-installer@v4.1.3
      - name: Sign and attest (keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign attest --yes --type cyclonedx --predicate sbom-sidecar.cdx.json "$IMAGE@$DIGEST"
      - name: Verify the signature and attestation just published (evidence in this log)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/sidecar-publish.yml@${{ github.ref }}
        run: |
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "$IDENTITY" --output text
          cosign verify-attestation --type cyclonedx "$IMAGE@$DIGEST" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "$IDENTITY" > /dev/null && echo "cyclonedx attestation verified for $IMAGE@$DIGEST"
      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Summary (pin this digest)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          {
            echo "### brokersre-ib-gateway-sidecar $VERSION"
            echo
            echo "Pin this exact build: \`$IMAGE@$DIGEST\`"
            echo
            echo "Verify: \`cosign verify $IMAGE@$DIGEST --certificate-oidc-issuer https://token.actions.githubusercontent.com --certificate-identity-regexp '^https://github.com/RocketEdge/brokersre-ib-gateway/.github/workflows/sidecar-publish.yml@'\`"
            echo
            echo "Interactive Brokers, IBKR, IB Gateway and Trader Workstation are trademarks of Interactive Brokers LLC. This project is not affiliated with, endorsed by or sponsored by Interactive Brokers."
          } >> "$GITHUB_STEP_SUMMARY"
