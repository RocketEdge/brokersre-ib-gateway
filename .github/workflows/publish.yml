# Build, scan, sign, attest and tag both channels whenever an image input changes on main, or on
# demand (also used for OS-patch rebuilds with a -rYYYYMMDD suffix, monthly and when rebuild.yml
# finds a fixable finding). Each channel gets a git tag v<version>-<channel>[-rDATE] and a GitHub
# release carrying digests.json, the SBOM and the VEX document for IBKR's bundled jars.
#
# Order, and why (a tag never points at bytes that were not scanned and signed):
#   1. build linux/amd64 and linux/arm64 once and push the image index BY DIGEST ONLY: it has no
#      tag, so no consumer of a tag can receive it;
#   2. Trivy scans both platforms of exactly that digest from the registry (it reads the layers;
#      nothing is emulated). The gate is the same for both: fixable CRITICAL/HIGH in OS packages.
#      Scanning the pushed digest, rather than a local build, is what makes the scanned bytes
#      and the published bytes the same bytes;
#   3. SBOM, cosign signature, SBOM and VEX attestations, build provenance, all on the digest;
#   4. only then scripts/promote-tags.sh points the tags at that digest and checks that every
#      tag resolves to it.
# A build that fails the gate leaves an untagged, unsigned manifest in the registry and nothing
# else: no tag, no signature, no release (SECURITY.md).
name: Publish

on:
  push:
    branches: [main]
    paths:
      - versions.json
      - Dockerfile
      - docker-bake.hcl
      - rootfs/**
      - scripts/fetch-installer.sh
      - .github/workflows/publish.yml
  workflow_dispatch:
    inputs:
      rebuild:
        description: OS-patch rebuild of the pinned versions (adds -rYYYYMMDD tags, re-points channel tags)
        type: boolean
        default: false
      channels:
        description: Channels to publish (space separated)
        type: string
        default: "stable latest"

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/rocketedge/brokersre-ib-gateway

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      channels: ${{ steps.plan.outputs.channels }}
    steps:
      - id: plan
        run: |
          raw="${{ inputs.channels || 'stable latest' }}"
          json=$(printf '%s\n' $raw | jq -R . | jq -sc .)
          echo "channels=$json" >> "$GITHUB_OUTPUT"

  publish:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJson(needs.plan.outputs.channels) }}
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      security-events: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@v4.4.0
        with:
          platforms: linux/amd64,linux/arm64
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve build variables
        id: vars
        run: |
          eval "$(scripts/bake-env.sh)"
          ch="${{ matrix.channel }}"
          case "$ch" in
            stable) version="$STABLE_VERSION" ;;
            latest) version="$LATEST_VERSION" ;;
            *) echo "unknown channel $ch"; exit 1 ;;
          esac
          suffix=""
          if [ "${{ inputs.rebuild }}" = "true" ]; then suffix="-r$(date -u +%Y%m%d)"; fi
          echo "REBUILD_SUFFIX=$suffix" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}-${ch}${suffix}" >> "$GITHUB_OUTPUT"
          # GITHUB_ENV takes NAME=value literally (no shell quoting), so re-export the evaluated values.
          for v in UBUNTU_DIGEST IBC_VERSION IBC_RELEASE_TAG IBC_SHA256 STABLE_VERSION STABLE_MINOR STABLE_SHA256_X64 STABLE_SHA256_ARM LATEST_VERSION LATEST_MINOR LATEST_SHA256_X64 LATEST_SHA256_ARM SOURCE_REVISION CREATED; do
            echo "$v=${!v}" >> "$GITHUB_ENV"
          done
      - name: Pre-fetch archived installers when IBKR has moved on (optional)
        # Only needed when rebuilding a version IBKR no longer serves at its channel URL. The
        # private archive needs ARCHIVE_READ_TOKEN; without it the Dockerfile uses IBKR's URL.
        # scripts/prefetch-installers.sh keeps only copies that match the pin, so a stale archive
        # copy (IBKR re-uploaded the version) falls back to the URL instead of failing the build.
        env:
          GH_TOKEN: ${{ secrets.ARCHIVE_READ_TOKEN }}
          CHANNEL: ${{ matrix.channel }}
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          if [ "$CHANNEL" = stable ]; then x64="$STABLE_SHA256_X64"; arm="$STABLE_SHA256_ARM"; else x64="$LATEST_SHA256_X64"; arm="$LATEST_SHA256_ARM"; fi
          scripts/prefetch-installers.sh "$CHANNEL" "$VERSION" "$x64" "$arm" downloads
      - name: Build both platforms and push by digest only (no tag moves)
        id: push
        # `*.tags=<name without a tag>` plus push-by-digest pushes the image index under its
        # digest alone. The tags of docker-bake.hcl are applied later by promote-tags.sh.
        run: |
          docker buildx bake ${{ matrix.channel }} \
            --set '*.cache-from=type=gha' --set '*.cache-to=type=gha,mode=max' \
            --set "*.tags=$IMAGE" \
            --set '*.output=type=image,push-by-digest=true,name-canonical=true,push=true' \
            --metadata-file meta.json
          digest=$(jq -r '.["${{ matrix.channel }}"]["containerimage.digest"]' meta.json)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no image digest in meta.json (got '$digest')"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "pushed by digest, untagged: $IMAGE@$digest"
      # The two gates differ only in TRIVY_PLATFORM. TRIVY_IMAGE_SRC=remote makes Trivy read the
      # pushed digest from the registry instead of looking for a local image first. The arm64
      # gate also runs when the amd64 gate failed, so one run shows both results.
      - name: Trivy gate, linux/amd64, before any tag moves (fixable CRITICAL/HIGH in OS packages)
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
          TRIVY_IMAGE_SRC: remote
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: sarif
          output: trivy-amd64.sarif
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # OS packages are what this image can patch. IBKR's bundled jars are reported by the
          # steps below but not gated: see docs/limitations.md L08.
          vuln-type: os
      - name: Trivy gate, linux/arm64, before any tag moves (fixable CRITICAL/HIGH in OS packages)
        if: ${{ !cancelled() && steps.push.outputs.digest != '' }}
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
          TRIVY_IMAGE_SRC: remote
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: sarif
          output: trivy-arm64.sarif
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os
      - name: Trivy report of IBKR-bundled jars (not gated, docs/limitations.md L08)
        if: ${{ !cancelled() && steps.push.outputs.digest != '' }}
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
          TRIVY_IMAGE_SRC: remote
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          vuln-type: library
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      # Unfiltered JSON of the jars of both platforms: the input of the VEX drift check. Neither
      # these scans nor the check can fail the publish (an OS-patch rebuild must not wait for a
      # document), so each step continues on error and the check only warns.
      - name: Trivy JSON of the bundled jars, linux/amd64 (input of the VEX drift check)
        if: ${{ !cancelled() && steps.push.outputs.digest != '' }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
          TRIVY_IMAGE_SRC: remote
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          vuln-type: library
          format: json
          output: trivy-library-amd64.json
          exit-code: "0"
          list-all-pkgs: "true"
      - name: Trivy JSON of the bundled jars, linux/arm64 (input of the VEX drift check)
        if: ${{ !cancelled() && steps.push.outputs.digest != '' }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
          TRIVY_IMAGE_SRC: remote
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          vuln-type: library
          format: json
          output: trivy-library-arm64.json
          exit-code: "0"
          list-all-pkgs: "true"
      - name: VEX drift check (not gated, docs/limitations.md L08)
        if: ${{ !cancelled() && steps.push.outputs.digest != '' }}
        run: |
          rc=0
          scripts/check-vex.sh security/vex/ibgateway-vendor-jars.openvex.json trivy-library-amd64.json trivy-library-arm64.json || rc=$?
          case "$rc" in
            0) ;;
            1) echo "::warning title=VEX drift (${{ matrix.channel }})::security/vex/ibgateway-vendor-jars.openvex.json and Trivy's findings for the bundled jars differ; see the MISSING and STALE lines of this step. A statement that is STALE here may belong to the other channel." ;;
            *) echo "::warning title=VEX drift check did not run (${{ matrix.channel }})::scripts/check-vex.sh exited $rc; see this step's log." ;;
          esac
      - name: Upload Trivy SARIF (linux/amd64)
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4.39.3
        with:
          sarif_file: trivy-amd64.sarif
          category: trivy-os-${{ matrix.channel }}-amd64
      - name: Upload Trivy SARIF (linux/arm64)
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4.39.3
        with:
          sarif_file: trivy-arm64.sarif
          category: trivy-os-${{ matrix.channel }}-arm64
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.channel }}.cdx.json
          upload-artifact: true
          upload-release-assets: false
      - uses: sigstore/cosign-installer@v4.1.3
      - name: Sign and attest (keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        # The VEX document (docs/limitations.md L08) is attested like the SBOM, so a scanner can
        # find this project's statements about IBKR's bundled jars next to the image
        # (`trivy image --vex oci`), signed by the same workflow identity.
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign attest --yes --type cyclonedx --predicate "sbom-${{ matrix.channel }}.cdx.json" "$IMAGE@$DIGEST"
          cosign attest --yes --type openvex --predicate security/vex/ibgateway-vendor-jars.openvex.json "$IMAGE@$DIGEST"
      - name: Verify the signature and attestations just published (evidence in this log)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/publish.yml@${{ github.ref }}
        run: |
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "$IDENTITY" --output text
          cosign verify-attestation --type cyclonedx "$IMAGE@$DIGEST" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "$IDENTITY" > /dev/null && echo "cyclonedx attestation verified for $IMAGE@$DIGEST"
          cosign verify-attestation --type openvex "$IMAGE@$DIGEST" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "$IDENTITY" > /dev/null && echo "openvex attestation verified for $IMAGE@$DIGEST"
      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Move the channel's tags to the scanned and signed digest
        # The tag list is the bake target's (docker-bake.hcl), the single place that names tags.
        # promote-tags.sh creates them from the digest and fails unless each resolves to it.
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mapfile -t tags < <(docker buildx bake --print "${{ matrix.channel }}" | jq -r '.target["${{ matrix.channel }}"].tags[]')
          scripts/promote-tags.sh "$IMAGE" "$DIGEST" "${tags[@]}"
      - name: digests.json
        run: |
          jq -n --arg channel "${{ matrix.channel }}" --arg version "${{ steps.vars.outputs.version }}" \
                --arg digest "${{ steps.push.outputs.digest }}" --arg image "$IMAGE" --arg tag "${{ steps.vars.outputs.tag }}" \
                --arg ibc "$IBC_RELEASE_TAG" --arg base "$UBUNTU_DIGEST" --arg created "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                '{channel:$channel, gateway_version:$version, image:$image, digest:$digest, pinned_ref:($image+"@"+$digest), git_tag:$tag, ibc_release:$ibc, base_digest:$base, created:$created}' \
                > "digests-${{ matrix.channel }}.json"
          cat "digests-${{ matrix.channel }}.json"
          echo "### ${{ matrix.channel }}" >> "$GITHUB_STEP_SUMMARY"
          echo "$IMAGE@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          # Built with printf so every line stays indented inside this YAML block scalar.
          notes="$(printf '%s\n\n%s\n\n%s\n\n%s\n\n%s\n' \
            "IB Gateway ${{ steps.vars.outputs.version }} (IBKR ${{ matrix.channel }} channel) with IBC $IBC_RELEASE_TAG on ubuntu:26.04@$UBUNTU_DIGEST." \
            "Pin this exact build: \`$IMAGE@${{ steps.push.outputs.digest }}\`" \
            "Verify: \`cosign verify $IMAGE@${{ steps.push.outputs.digest }} --certificate-oidc-issuer https://token.actions.githubusercontent.com --certificate-identity-regexp '^https://github.com/RocketEdge/brokersre-ib-gateway/.github/workflows/publish.yml@'\`" \
            "Both platforms (linux/amd64, linux/arm64) of this digest passed the Trivy gate for OS packages before the tags moved. IBKR's bundled jars carry known CVEs that this image cannot patch; the attached \`ibgateway-vendor-jars.openvex.json\` states what is and is not known about each (docs/evidence.md)." \
            "Interactive Brokers, IBKR, TWS and IB Gateway are trademarks of Interactive Brokers LLC. Not affiliated with Interactive Brokers.")"
          # The tag is created server-side by the release API: GITHUB_TOKEN may not `git push` a ref
          # whose commit contains workflow files ("refusing to allow a GitHub App to create or update workflow").
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Republishing an already released version: replace the assets and the notes, so the
            # digest the notes show is the one the channel tag now points at. Editing a release
            # sends watchers no notification; only a new release does.
            gh release upload "$TAG" "digests-${{ matrix.channel }}.json" "sbom-${{ matrix.channel }}.cdx.json" security/vex/ibgateway-vendor-jars.openvex.json --clobber
            gh release edit "$TAG" --notes "$notes"
          else
            gh release create "$TAG" "digests-${{ matrix.channel }}.json" "sbom-${{ matrix.channel }}.cdx.json" security/vex/ibgateway-vendor-jars.openvex.json --target "$GITHUB_SHA" --title "$TAG" --notes "$notes"
          fi
