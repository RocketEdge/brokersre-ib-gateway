# Reference compose for brokersre-ib-gateway. Pin the image by DIGEST in production (the
# publish workflow prints it); the tag below is for local evaluation only.
# Secrets come from files (Docker secrets); never put TWS_USERID/TWS_PASSWORD in this file.
services:
  ib-gateway:
    image: ghcr.io/rocketedge/brokersre-ib-gateway:stable
    restart: unless-stopped
    read_only: true
    tmpfs:
      # A tmpfs is root-owned 0755 unless told otherwise and the gateway runs as uid 1000; the
      # entrypoint refuses to start (event dirs_not_writable) when a path is not writable.
      - /tmp:size=64m
      - /run/brokersre:size=16m,uid=1000,gid=1000,mode=0750
    security_opt:
      - no-new-privileges:true
    environment:
      TWS_USERID_FILE: /run/secrets/ib-username
      TWS_PASSWORD_FILE: /run/secrets/ib-password
      TRADING_MODE: ${TRADING_MODE:-paper}          # live | paper (one session per container)
      READ_ONLY_API: ${READ_ONLY_API:-yes}
      TWOFA_TIMEOUT_ACTION: restart
      RELOGIN_AFTER_TWOFA_TIMEOUT: "yes"
      TWOFA_EXIT_INTERVAL: "60"
      AUTO_RESTART_TIME: ${AUTO_RESTART_TIME:-11:45 PM}   # exchange-local; outside IBKR reset windows
      TIME_ZONE: ${TIME_ZONE:-America/New_York}
      EXISTING_SESSION_DETECTED_ACTION: primary
      IBC_COMMAND_SERVER_PORT: "7462"               # loopback only; reachable by a sidecar sharing this network namespace
      # VNC_SERVER_PASSWORD_FILE: /run/secrets/vnc-password   # break-glass only; bound to 127.0.0.1 inside the container
    secrets:
      - ib-username
      - ib-password
    volumes:
      - ibgw-settings:/home/ibgateway/Jts/settings
      - ibgw-logs:/var/log/ibgateway
    ports:
      # Bind the relay to the private NIC your strategy host can reach; never 0.0.0.0 on a public host.
      - "${PRIVATE_IP:-127.0.0.1}:4001:4003"   # live API via socat
      - "${PRIVATE_IP:-127.0.0.1}:4002:4004"   # paper API via socat
    healthcheck:
      test: ["CMD", "/usr/local/lib/brokersre/healthcheck.sh"]
      interval: 15s
      timeout: 5s
      start_period: 300s
      retries: 3

secrets:
  ib-username:
    file: ./secrets/ib-username
  ib-password:
    file: ./secrets/ib-password

volumes:
  ibgw-settings:
  ibgw-logs:
